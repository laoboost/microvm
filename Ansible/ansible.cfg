[defaults]
inventory            = ./inventory/aws_ec2.yml
# Host key checking stays ON. known_hosts must be populated before running any
# playbook; Ansible will not do it for you and there is no ssh-keyscan step in
# this repo. One way, after a terraform apply:
#   aws ec2 describe-instances --filters Name=instance-state-name,Values=running \
#     --query 'Reservations[].Instances[].PublicIpAddress' --output text \
#     | xargs -n1 ssh-keyscan -H >> ~/.ssh/known_hosts
# Disabling this silently accepted MITM on every first connection.
host_key_checking    = True
stdout_callback      = default
result_format        = yaml
forks                = 10
remote_user          = ubuntu
private_key_file     = ~/.ssh/id_rsa
retry_files_enabled  = False
interpreter_python   = auto_silent
deprecation_warnings = False

[inventory]
enable_plugins = amazon.aws.aws_ec2

[ssh_connection]
pipelining     = True
ssh_args       = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
